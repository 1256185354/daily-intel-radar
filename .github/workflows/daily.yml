# 每日情报雷达 · GitHub Actions 云端采集 + Pages 发布
# 放在仓库的 .github/workflows/daily.yml
# 每天 08:05 UTC（= 16:05 Asia/Shanghai）在 GitHub 机房跑采集、构建单文件看板并发布到 Pages；
# 同时把发布产物持久化到 gh-pages 分支，实现历史归档跨天累积（不依赖电脑）。
name: daily-intel-radar

on:
  schedule:
    # 早间版：08:35 Asia/Shanghai = 00:35 UTC（隔夜全球信息 + 上一交易日 A股收盘）
    - cron: "35 0 * * *"
    # 收盘版：16:05 Asia/Shanghai = 08:05 UTC（A股当日收盘全量数据；周末也照常跑）
    - cron: "5 8 * * *"
  workflow_dispatch:

permissions:
  contents: write      # 需要把历史归档持久化到 gh-pages 分支
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore previous days from gh-pages branch
        run: |
          set -e
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git worktree add /tmp/prev FETCH_HEAD
            mkdir -p intel/data
            for d in /tmp/prev/20*/; do
              [ -d "$d" ] || continue
              name=$(basename "$d")
              [ -f "$d/index.html" ] || continue
              if [ ! -d "intel/data/$name" ]; then
                cp -r "$d" "intel/data/$name"
                echo "restored $name"
              fi
            done
          else
            echo "no gh-pages branch yet"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect data & build dashboard/report
        env:
          PYTHONIOENCODING: utf-8
          TZ: Asia/Shanghai
        run: |
          python intel/src/run_daily.py --skip-share --skip-push --skip-publish

      - name: Prepare static site
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python intel/src/build_site_artifact.py --out _site

      - name: Show summary
        run: |
          ls -la _site
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Persist site to gh-pages branch (history)
        run: |
          set -e
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git worktree add /tmp/ghp FETCH_HEAD
          else
            git worktree add /tmp/ghp -b gh-pages
          fi
          rm -rf /tmp/ghp/*
          cp -r _site/. /tmp/ghp/
          cd /tmp/ghp
          git add -A
          git -c user.name="daily-intel-bot" -c user.email="daily-intel-bot@users.noreply.github.com" \
              commit -m "publish $(date -u +%F)" || echo "nothing to commit"
          git push origin HEAD:gh-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
